{% with request.resolver_match.url_name as url_name %}

<nav class="bg-gray-950/50 shadow-sm shadow-gray-800/30 sticky top-0 backdrop-blur-sm z-50">

    <div class="max-w-6xl m-auto flex items-center justify-between gap-4 p-4">

        <a href="{% url 'home' %}" class="select-none">

            <span class="px-2 py-1 rounded-sm bg-indigo-600 text-gray-950 font-bold inline-block text-center">
                V
            </span>

            <span class="px-2 text-indigo-500 font-bold">
                VIDSYRA
            </span>

        </a>

        <div class="flex items-center gap-2 sm:gap-4 text-sm">

            <a href="{% url 'home' %}"
                class="px-2 {% if url_name == 'home' %} text-indigo-400 font-semibold {% else %} text-white hover:text-indigo-400 {% endif %}">
                Home
            </a>

            <a href="{% url 'home' %}"
                class="px-2 {% if url_name == 'blogs' %} text-indigo-400 font-semibold {% else %} text-white hover:text-indigo-400 {% endif %}">
                Blogs
            </a>

            <a href="{% url 'home' %}"
                class="px-2 {% if url_name == 'about' %} text-indigo-400 font-semibold {% else %} text-white hover:text-indigo-400 {% endif %} hidden sm:inline-block">
                About
            </a>

            <a href="{% url 'home' %}"
                class="px-2 {% if url_name == 'login' %} text-indigo-400 font-semibold {% else %} text-white hover:text-indigo-400 {% endif %}">
                Login
            </a>

        </div>

    </div>

</nav>

{% endwith %}
