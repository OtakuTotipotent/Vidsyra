{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover video content and inspiration with Vidsyra.">
    <meta name="keywords" content="Vidsyra, video, videos, video discovery, Youtube">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    <title>
        Vidsyra |
        {% block title %}
        Home
        {% endblock title %}
    </title>

    <style>
        /* Overall Scrolling Experience */
        * {
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #101828;
        }

        ::-webkit-scrollbar-thumb {
            background: #6366f1;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4338ca;
        }

        /* Main Loader Performance */

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg)
            }
        }

        .load {
            display: none;
            width: 100px;
            height: 100px;
            margin: 48px auto;
            border: dashed 7px #6366f1;
            border-radius: 50%;
            border-right-color: transparent;
            border-left-color: transparent;
            transition: all 0.5s ease-in;
            animation-name: rotate;
            animation-duration: 1.0s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }
    </style>
</head>
