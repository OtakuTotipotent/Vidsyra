        <a href="{% url 'home' %}" class="select-none">
            <span class="px-2 py-1 rounded-sm bg-indigo-600 text-gray-950 font-bold inline-block text-center">V</span>
            <span class="px-2 text-indigo-500 font-bold">VIDSYRA</span>
        </a>
        <div class="flex items-center gap-2 sm:gap-4 text-sm">

            <a href="#" class="px-2 text-white hover:text-indigo-400 hidden sm:inline-block">About</a>
