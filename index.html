<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover video content and inspiration with Vidsyra.">
    <meta name="keywords" content="Vidsyra, video, videos, video discovery, Youtube">

    <link rel="stylesheet" href="./src/output.css">
    <title>Vidsyra</title>
</head>

<body
    class="bg-gray-900 text-gray-200 w-dvw h-dvh selection:bg-indigo-500/80 selection:text-black antialiased transition-all">

    <!-- navigation -->
    <nav class="flex items-center justify-between gap-4 p-4 bg-gray-950/50 shadow-sm shadow-gray-800/30">
        <div class="select-none cursor-default">
            <span class="p-2 rounded-md bg-indigo-500/80 font-bold text-gray-950/80">
                V
            </span>
            <span class="px-2 text-indigo-500 uppercase font-bold">
                Vidsyra
            </span>
        </div>
        <div>
            <a href="#" class="px-2 text-gray-200 hover:text-indigo-400">
                Login
            </a>
            <a href="#" class="px-2 text-gray-200 hover:text-indigo-400">
                About
            </a>
        </div>
    </nav>

    <!-- main content -->
    <main class="max-w-6xl m-auto p-4">

        <marquee class="text-gray-400 select-none cursor-default">
            Welcome to Vidsyra: A platform dedicated to Education & Research using Youtube content.
        </marquee>

        <!-- user inputs -->
        <section class="w-full sm:max-w-3xl m-auto my-5 p-6 shadow-sm shadow-gray-950 rounded-xl">
            <h1 class="font-semibold text-xl sm:text-3xl text-indigo-500">
                Unlock the Intelligence Behind Every Video.
            </h1>

            <p class="text-gray-400 py-2">
                Explore. Analyze. Learn. Create. Share.
            </p>

            <form method="get">
                <input type="text" name="link" id="link" placeholder="Paste a video link to get started..."
                    class="w-full outline-none rounded-lg py-2 px-4 my-2 bg-gray-500/20 text-indigo-400 placeholder:text-indigo-400/80">
            </form>

            <div class="my-2 flex gap-2 flex-wrap">
                <span class="py-0.5 px-2 bg-indigo-900/80 text-white/80 rounded-full text-sm">
                    AI Insights
                </span>
                <span class="py-0.5 px-2 bg-indigo-900/80 text-white/80 rounded-full text-sm">
                    Video Tools
                </span>
                <span class="py-0.5 px-2 bg-indigo-900/80 text-white/80 rounded-full text-sm">
                    Creator Intelligence
                </span>
            </div>
        </section>

    </main>

</body>

</html>
